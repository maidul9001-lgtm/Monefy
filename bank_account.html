<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ব্যাংক হিসাব — হিসাবের খাতা</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2f6f55">
<style>
:root{--ink:#26332C;--soft:#5B6960;--paper:#F7F2E4;--line:rgba(38,51,44,.14);--gold:#8C6A22;--red:#AE3A34;--green:#3E6A4C;--blue:#2E5C8A;--bg:#E4DCC6}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);font-family:Arial,'Noto Sans Bengali',sans-serif;color:var(--ink)}.card{max-width:440px;margin:8px auto;background:var(--paper);border-radius:12px;overflow:hidden;box-shadow:0 18px 40px -18px #26332c}.header{padding:20px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line)}.back{font-size:22px;text-decoration:none;color:var(--gold)}h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--soft);margin-top:3px}.total{margin:18px;padding:18px;text-align:center;border:1px solid var(--line);border-radius:12px;background:linear-gradient(135deg,#eee4c8,#e8eee9)}.total small{color:var(--soft)}.amount{font-size:30px;font-weight:700;color:var(--green);margin:4px}.amount.neg,.bal.neg{color:var(--red)}.break{display:flex;border-top:1px dashed var(--line);padding-top:10px}.break>div{flex:1;font-size:12px;color:var(--soft)}.break b{display:block;font-size:15px;color:var(--ink)}section{padding:0 18px 12px}.sect{display:flex;align-items:center;gap:8px;margin:8px 0}.sect h2{font-size:14px;margin:0;background:#eee3c7;padding:5px 10px;border-radius:99px}.sect.wallet h2{color:var(--blue);background:#e2eaf2}.sect .gt{margin-left:auto;font-weight:700}.add{border:0;border-radius:99px;background:var(--gold);color:white;width:34px;height:34px;font-size:20px}.add.w{background:var(--blue)}.accounts{display:flex;flex-direction:column;gap:10px}.acc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#ffffff42}.top{display:flex;align-items:center;gap:10px;padding:13px;cursor:pointer}.icon{width:40px;height:40px;border-radius:10px;background:#b4862c26;display:grid;place-items:center;font-size:19px}.icon.w{background:#2e5c8a20}.info{flex:1;min-width:0}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--soft)}.bal{font-weight:700;color:var(--green)}.body{display:none;border-top:1px dashed var(--line);padding:10px 13px}.acc.open .body{display:block}.actions{display:flex;gap:7px}.txbtn,.manage button{flex:1;border:0;border-radius:8px;padding:9px;font-family:inherit}.txbtn.d{background:#3e6a4c20;color:var(--green)}.txbtn.w{background:#ae3a341c;color:var(--red)}.form{display:none;gap:6px;flex-wrap:wrap;margin:9px 0}.form.show{display:flex}.form input{padding:8px;border:1px solid var(--line);border-radius:7px;min-width:0}.form .amt{width:95px}.form .note{flex:1}.form .date{width:125px}.submit{border:0;border-radius:7px;padding:8px 10px;color:white;background:var(--green)}.form.wf .submit{background:var(--red)}.tx{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12px}.tx:last-child{border-bottom:0}.dot{width:7px;height:7px;border-radius:50%}.dot.d{background:var(--green)}.dot.w{background:var(--red)}.txmid{flex:1}.txdate{font-size:10px;color:var(--soft)}.txamt.d{color:var(--green)}.txamt.w{color:var(--red)}.del{border:0;background:none;color:var(--red)}.manage{display:flex;gap:7px;border-top:1px dashed var(--line);padding-top:8px;margin-top:5px}.manage button{background:none;border:1px solid var(--line);font-size:11px}.manage .danger{color:var(--red)}.empty{padding:12px;text-align:center;color:var(--soft);font-size:12px}.footer{padding:16px;text-align:center;border-top:1px solid var(--line);font-size:11px;color:var(--soft)}.overlay{position:fixed;inset:0;background:#26332c99;display:none;align-items:center;justify-content:center;padding:16px}.overlay.open{display:flex}.modal{max-width:360px;width:100%;background:var(--paper);padding:18px;border-radius:12px}.modal h3{margin:0 0 10px}.modal input{width:100%;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:8px}.modal button{width:100%;padding:10px;margin-top:8px;border:0;border-radius:8px;background:var(--gold);color:white}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:none}.pill.sel{background:var(--gold);color:white}.status{text-align:center;font-size:12px;color:var(--soft);min-height:18px}
</style></head><body>
<div class="card"><header class="header"><a class="back" href="index.html">←</a><div><h1>ব্যাংক হিসাব</h1><div class="sub">ব্যাংক ও মোবাইল ব্যাংকিং একাউন্টের জমা-উত্তোলন ও ব্যালেন্স</div></div></header>
<div class="total"><small>সর্বমোট ব্যালেন্স</small><div id="total" class="amount">৳০</div><div class="break"><div>🏦 ব্যাংক<b id="bankTotal">৳০</b></div><div>📱 মোবাইল ব্যাংকিং<b id="walletTotal">৳০</b></div></div></div>
<section><div class="sect"><h2>🏦 ব্যাংক অ্যাকাউন্ট</h2><span class="gt" id="bankBadge">৳০</span><button class="add" id="addBank">+</button></div><div id="banks" class="accounts"></div></section>
<section><div class="sect wallet"><h2>📱 মোবাইল ব্যাংকিং (বিকাশ / নগদ)</h2><span class="gt" id="walletBadge">৳০</span><button class="add w" id="addWallet">+</button></div><div id="wallets" class="accounts"></div></section>
<div class="footer">তথ্য এই ডিভাইসে সংরক্ষিত থাকে • Firebase Sync চালু থাকলে ক্লাউডেও সিঙ্ক হবে</div></div>
<div class="overlay" id="modal"><div class="modal"><h3 id="modalTitle">জমা করুন</h3><div id="modalContent"></div><div class="status" id="status"></div><button id="closeModal">বন্ধ করুন</button></div></div>
<script src="api/sync-client.js"></script>
<script>
(()=>{const KEY='bank-account-data';let data={accounts:[]},open=null;
function defaults(){return{accounts:[['a_pubali','bank','পূবালী ব্যাংক'],['a_agrani','bank','অগ্রণী ব্যাংক'],['a_islami','bank','ইসলামী ব্যাংক'],['a_cellfin','bank','সেলফিন ওয়ালেট'],['a_bkash','wallet','বিকাশ'],['a_nagad','wallet','নগদ']].map(x=>({id:x[0],group:x[1],name:x[2],openingBalance:0,transactions:[]}))}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.accounts)){data=x;data.accounts.forEach(a=>{if(!a.group)a.group='bank';if(!Array.isArray(a.transactions))a.transactions=[]});return}}catch(e){}data=defaults();save()}
function save(){localStorage.setItem(KEY,JSON.stringify(data));if(window.HKSync)HKSync.status().then(s=>s.loggedIn?HKSync.sync().catch(()=>{}):null).catch(()=>{})}
function bal(a){return(+a.openingBalance||0)+a.transactions.reduce((s,t)=>s+(t.type==='deposit'?+t.amount:-+t.amount),0)}function money(n){n=Math.round(+n||0);let s=Math.abs(n)+'';let l=s.slice(-3),r=s.slice(0,-3);if(r)l=','+l;r=r.replace(/\B(?=(\d{2})+(?!\d))/g,',');return(n<0?'-':'')+'৳'+r+l}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){let d=new Date();return d.toISOString().slice(0,10)}
function render(){let bt=0,wt=0;for(let a of data.accounts){let b=bal(a);a.group==='wallet'?wt+=b:bt+=b}document.getElementById('total').textContent=money(bt+wt);document.getElementById('bankTotal').textContent=money(bt);document.getElementById('walletTotal').textContent=money(wt);document.getElementById('bankBadge').textContent=money(bt);document.getElementById('walletBadge').textContent=money(wt);draw('bank','banks');draw('wallet','wallets')}
function draw(group,id){let list=document.getElementById(id),arr=data.accounts.filter(a=>a.group===group);list.innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">কোনো অ্যাকাউন্ট নেই।</div>'}
function card(a){let b=bal(a),tx=a.transactions.slice().reverse().map(t=>`<div class="tx"><i class="dot ${t.type==='deposit'?'d':'w'}"></i><div class="txmid"><div>${esc(t.note|| (t.type==='deposit'?'জমা':'উত্তোলন'))}</div><div class="txdate">${esc(t.date||'')}</div></div><b class="txamt ${t.type==='deposit'?'d':'w'}">${t.type==='deposit'?'+':'-'}${money(t.amount)}</b><button class="del" data-del="${t.id}">×</button></div>`).join('');return`<div class="acc ${open===a.id?'open':''}" data-id="${a.id}"><div class="top" data-open="1"><div class="icon ${a.group==='wallet'?'w':''}">${a.group==='wallet'?'📱':'🏦'}</div><div class="info"><div class="name">${esc(a.name)}</div><div class="meta">${a.transactions.length} টি লেনদেন</div></div><b class="bal ${b<0?'neg':''}">${money(b)}</b><span>›</span></div><div class="body"><div class="actions"><button class="txbtn d" data-form="d">↑ জমা</button><button class="txbtn w" data-form="w">↓ উত্তোলন</button></div><div class="form" data-formbox="d"><input class="amt" type="number" placeholder="৳ পরিমাণ"><input class="note" placeholder="বিবরণ"><input class="date" type="date" value="${today()}"><button class="submit" data-submit="deposit">যোগ করুন</button></div><div class="form wf" data-formbox="w"><input class="amt" type="number" placeholder="৳ পরিমাণ"><input class="note" placeholder="বিবরণ"><input class="date" type="date" value="${today()}"><button class="submit" data-submit="withdraw">যোগ করুন</button></div>${tx||'<div class="empty">এখনও কোনো লেনদেন নেই।</div>'}<div class="manage"><button data-rename>✏️ নাম পরিবর্তন</button><button class="danger" data-remove>🗑️ মুছুন</button></div></div></div>`}
function bind(id){document.getElementById(id).addEventListener('click',e=>{let c=e.target.closest('.acc');if(!c)return;let a=data.accounts.find(x=>x.id===c.dataset.id);if(e.target.closest('[data-open]')){open=open===a.id?null:a.id;render();return}if(e.target.closest('[data-form]')){let f=e.target.closest('[data-form]').dataset.form;c.querySelectorAll('.form').forEach(x=>x.classList.toggle('show',x.dataset.formbox===f));return}let sub=e.target.closest('[data-submit]');if(sub){let f=sub.closest('.form'),amt=+f.querySelector('.amt').value;if(!amt||amt<=0)return;if(sub.dataset.submit==='withdraw'&&amt>bal(a)){alert(`"${a.name}"-এ পর্যাপ্ত ব্যালেন্স নেই। বর্তমান ব্যালেন্স: ${money(bal(a))}`);return}a.transactions.push({id:'t'+Date.now(),type:sub.dataset.submit,amount:amt,note:f.querySelector('.note').value.trim(),date:f.querySelector('.date').value||today()});save();render();return}let del=e.target.closest('[data-del]');if(del){a.transactions=a.transactions.filter(t=>t.id!==del.dataset.del);save();render();return}if(e.target.closest('[data-rename]')){let n=prompt('নতুন নাম লিখুন:',a.name);if(n&&n.trim()){a.name=n.trim();save();render()}return}if(e.target.closest('[data-remove]')){if(confirm(`"${a.name}" অ্যাকাউন্টটি মুছে ফেলবেন?`)){data.accounts=data.accounts.filter(x=>x.id!==a.id);open=null;save();render()}return}})}bind('banks');bind('wallets');
const ov=document.getElementById('modal'),content=document.getElementById('modalContent');function modal(title,group){document.getElementById('modalTitle').textContent=title;document.getElementById('status').textContent='';content.innerHTML=`<div class="pills">${data.accounts.filter(a=>a.group===group).map(a=>`<button class="pill" data-acc="${a.id}">${esc(a.name)}</button>`).join('')}</div><input id="mAmount" type="number" placeholder="পরিমাণ (৳)"><input id="mName" placeholder="নতুন অ্যাকাউন্টের নাম"><input id="mOpening" type="number" placeholder="বর্তমান ব্যালেন্স (ঐচ্ছিক)"><button id="mAdd">নতুন অ্যাকাউন্ট যোগ করুন</button><button id="mDeposit">নির্বাচিত অ্যাকাউন্টে জমা করুন</button>`;let sel=null;content.onclick=e=>{let p=e.target.closest('[data-acc]');if(p){sel=p.dataset.acc;content.querySelectorAll('.pill').forEach(x=>x.classList.toggle('sel',x===p))}if(e.target.id==='mAdd'){let n=document.getElementById('mName').value.trim();if(!n){document.getElementById('status').textContent='নাম লিখুন।';return}data.accounts.push({id:'a'+Date.now(),group,name:n,openingBalance:+document.getElementById('mOpening').value||0,transactions:[]});save();ov.classList.remove('open');render()}if(e.target.id==='mDeposit'){let a=data.accounts.find(x=>x.id===sel),v=+document.getElementById('mAmount').value;if(!a||!v||v<=0){document.getElementById('status').textContent='অ্যাকাউন্ট ও সঠিক পরিমাণ নির্বাচন করুন।';return}a.transactions.push({id:'t'+Date.now(),type:'deposit',amount:v,note:'',date:today()});save();ov.classList.remove('open');open=a.id;render()}};ov.classList.add('open')}
document.getElementById('addBank').onclick=()=>modal('🏦 ব্যাংকে জমা করুন','bank');document.getElementById('addWallet').onclick=()=>modal('📱 মোবাইল ব্যাংকিং এ জমা','wallet');document.getElementById('closeModal').onclick=()=>ov.classList.remove('open');ov.onclick=e=>{if(e.target===ov)ov.classList.remove('open')};
load();render();
async function initialPull(){if(!window.HKSync)return;try{let s=await HKSync.status();if(!s.loggedIn)return;let before=localStorage.getItem(KEY);let r=await HKSync.pull();let after=localStorage.getItem(KEY);if(r&&r.data&&after!==before){load();render()}}catch(e){}}
initialPull();window.addEventListener('online',()=>setTimeout(initialPull,1000));document.addEventListener('visibilitychange',()=>{if(!document.hidden)initialPull()});setInterval(()=>{if(navigator.onLine&&window.HKSync)HKSync.status().then(s=>{if(s.loggedIn)HKSync.sync().catch(()=>{})}).catch(()=>{})},15000);
})();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));</script>
</body></html>
